name: Jest Tests

on:
  pull_request: null

jobs:
  test:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: mobile-app
        run: bun install --frozen-lockfile

      - name: Run Jest tests
        working-directory: mobile-app
        run: bun jest --ci
