name: Tests

on:
  pull_request: null

permissions: {}

jobs:
  backend-tests:
    name: Backend Tests (Unit + Integration)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/gamelog/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Backend Pytest Suite
        working-directory: backend/gamelog
        run: uv run pytest tests -v

  frontend-tests:
    name: Frontend & Contract Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Run OpenAPI Contract Tests
        working-directory: mobile-app
        run: npm run test:contracts

      - name: Run Jest tests with coverage
        working-directory: mobile-app
        run: npx jest --ci