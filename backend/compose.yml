services:
  gamelog:
    build: 
      context: ./gamelog
    container_name: steam_stats_api
    volumes:
      - ./gamelog:/src
      - gamelog_venv:/src/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json
      - USE_FIREBASE_EMULATOR=${USE_FIREBASE_EMULATOR:-true}
      - FIREBASE_AUTH_EMULATOR_HOST=${FIREBASE_AUTH_EMULATOR_HOST:-host.docker.internal:9099}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-gamelog-40e10}
      - RUN_SCHEDULER=${RUN_SCHEDULER:-true}
    secrets:
      - source: firebase_service_account
        target: firebase-service-account.json
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    container_name: steam_stats_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  adminer:
    image: adminer
    container_name: steam_stats_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  gamelog_venv:

secrets:
  firebase_service_account:
    file: ${GOOGLE_APPLICATION_CREDENTIALS_HOST_PATH}
