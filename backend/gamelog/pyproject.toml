[project]
name = "gamelog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.0",
    "firebase-admin>=7.4.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.13.0",
    "debugpy>=1.8.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008", "BLE001", "DTZ011"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
import-roots = ["."]
search-path = ["."]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
executionEnvironments = [
  { root = "." }
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
