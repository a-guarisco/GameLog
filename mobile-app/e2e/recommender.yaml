appId: com.gamelog.app
onFlowComplete:
  - runFlow:
      file: common/logout_flow.yaml
  - stopApp
---
- launchApp
- extendedWaitUntil:
    visible: 'Sign In'
    timeout: 100000

- runFlow:
    when:
      visible: 'Sign In'
    file: common/login_flow.yaml
    env:
      EMAIL: test-01@test.com
      PASSWORD: 12345678

- extendedWaitUntil:
    visible: 'Games'
    timeout: 100000

# 1. Navigate to Social Tab
- tapOn:
    id: 'SocialTab'

- extendedWaitUntil:
    visible:
      id: 'social-recommender-card'
    timeout: 30000

# 2. Enter Game Recommender
- tapOn:
    id: 'social-recommender-card'

- extendedWaitUntil:
    visible: 'Game Recommender'
    timeout: 30000

# 3. Select friend from seed (test-02) to compare
- extendedWaitUntil:
    visible:
      id: 'select-friend-item-88888888-8888-8888-8888-888888888888'
    timeout: 30000

- tapOn:
    id: 'select-friend-item-88888888-8888-8888-8888-888888888888'

# 4. Assert active friend banner and recommendations loaded
- extendedWaitUntil:
    visible:
      id: 'search-another-friend-btn'
    timeout: 30000

- assertVisible: 'Active Friend'

# 5. Tap "Change Friend" to return to friend selection
- tapOn:
    id: 'search-another-friend-btn'

- extendedWaitUntil:
    visible:
      id: 'friend-search-input'
    timeout: 10000

# 6. Exit Recommender back to Social Home
- tapOn:
    id: 'recommendations-back-btn'
- tapOn:
    id: 'recommendations-back-btn'

- extendedWaitUntil:
    visible:
      id: 'social-recommender-card'
    timeout: 30000
